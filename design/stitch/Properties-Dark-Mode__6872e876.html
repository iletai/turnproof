<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Properties</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#1F3A64",
          "background-light": "#F2F2F7",
          "background-dark": "#14181e",
        },
        fontFamily: {
          "display": ["-apple-system", "BlinkMacSystemFont", "SF Pro Text", "SF Pro Display", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
      },
    },
  }
</script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #F2F2F7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    color: #000000;
    width: 100%;
    max-width: 390px;
    min-height: 844px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* Safe Area / Status Bar */
  .status-bar {
    position: sticky;
    top: 0;
    width: 100%;
    height: 47px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    background: transparent;
  }

  .status-time {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #000000;
  }

  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 125px;
    height: 35px;
    background-color: #000000;
    border-radius: 20px;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-icons svg {
    display: block;
    fill: #000000;
  }

  /* Translucent Liquid Glass Navigation Bar / Toolbar */
  .nav-bar {
    position: sticky;
    top: 47px;
    width: 100%;
    height: 44px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 16px;
    z-index: 90;
    background: rgba(242, 242, 247, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .plain-button {
    background: none;
    border: none;
    padding: 8px;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .plain-button.settings svg {
    fill: #000000;
  }

  .plain-button.plus svg {
    fill: #1F3A64;
  }

  /* Main Scroll Content */
  .content {
    padding: 0 16px 40px 16px;
  }

  /* Large Title */
  .large-title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.37px;
    line-height: 41px;
    color: #000000;
    margin-top: 4px;
    margin-bottom: 20px;
  }

  /* Section Header */
  .section-header {
    font-size: 13px;
    font-weight: 400;
    color: #6C6C70;
    text-transform: uppercase;
    letter-spacing: -0.08px;
    margin-left: 16px;
    margin-bottom: 8px;
  }

  /* Inset Grouped Section */
  .inset-group {
    background: #FFFFFF;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 26px;
  }

  /* Row Base */
  .row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    position: relative;
    cursor: pointer;
  }

  /* Continue Inspection Row */
  .continue-row {
    min-height: 72px;
  }

  .continue-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-right: 12px;
  }

  .title-primary {
    font-size: 17px;
    font-weight: 600;
    line-height: 22px;
    color: #000000;
    letter-spacing: -0.41px;
  }

  .subtitle-secondary {
    font-size: 15px;
    font-weight: 400;
    line-height: 20px;
    color: #6C6C70;
    letter-spacing: -0.24px;
  }

  .progress-container {
    width: 100%;
    height: 4px;
    background-color: #E5E5EA;
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 66.6%;
    background-color: #1F3A64;
    border-radius: 2px;
  }

  /* All Properties Rows */
  .property-row {
    min-height: 60px;
  }

  .property-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding-right: 12px;
  }

  .status-line {
    font-size: 13px;
    font-weight: 400;
    line-height: 18px;
    color: #6C6C70;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }

  .status-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .status-icon.orange svg {
    color: #C93400;
  }

  .status-icon.green svg {
    fill: #248A3D;
  }

  /* Disclosure Chevron */
  .chevron {
    flex-shrink: 0;
    width: 8px;
    height: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chevron svg {
    fill: #C7C7CC;
  }

  /* Separator starts 16pt from row's leading edge */
  .separator {
    position: absolute;
    bottom: 0;
    left: 16px;
    right: 0;
    height: 0.5px;
    background-color: #C6C6C8;
  }

  /* Home Indicator */
  .home-indicator-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 390px;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 8px;
    pointer-events: none;
    z-index: 100;
  }

  .home-indicator {
    width: 139px;
    height: 5px;
    background-color: #000000;
    border-radius: 2.5px;
  }
</style>
<style id="dark-mode-overrides">
  body {
    background-color: #000000 !important;
    color: #FFFFFF !important;
  }
  .status-time {
    color: #FFFFFF !important;
  }
  .nav-bar {
    background: rgba(28, 28, 30, 0.8) !important;
  }
  .large-title {
    color: #FFFFFF !important;
  }
  .section-header {
    color: #AEAEB2 !important;
  }
  .inset-group {
    background: #1C1C1E !important;
  }
  .title-primary {
    color: #FFFFFF !important;
  }
  .subtitle-secondary {
    color: #AEAEB2 !important;
  }
  .status-line {
    color: #AEAEB2 !important;
  }
  .progress-container {
    background-color: #3A3A3C !important;
  }
  .progress-bar-fill {
    background-color: #9DB8E8 !important;
  }
  .chevron svg path {
    fill: #48484A !important;
  }
  .separator {
    background-color: #38383A !important;
  }
  .home-indicator {
    background-color: #FFFFFF !important;
    opacity: 0.8 !important;
  }
</style></head>
<body>
<!-- Status Bar with Dynamic Island -->
<div class="status-bar">
<div class="status-time">9:41</div>
<div class="dynamic-island" style="border: 1px solid #2C2C2E; box-sizing: border-box; background-color: #000000;"></div>
<div class="status-icons"><!-- Cellular Signal -->
<svg height="12" viewbox="0 0 18 12" width="18">
<path d="M1 9.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V9.5zm5-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6.5zm5-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V3.5zm5-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V.5z" fill="#FFFFFF"></path>
</svg>

<svg height="12" viewbox="0 0 16 12" width="16">

<!-- Battery -->
<svg height="12" viewbox="0 0 25 12" width="25">
<rect fill="none" height="10" rx="3" stroke="#FFFFFF" stroke-width="1" width="20" x="1" y="1"></rect>
<rect fill="#FFFFFF" height="7" rx="1.5" width="13" x="2.5" y="2.5"></rect>
<path d="M22.5 4.5v3a1.5 1.5 0 0 0 1.5-1.5v0a1.5 1.5 0 0 0-1.5-1.5z" fill="#FFFFFF"></path>
</svg></div>
</div>
<!-- Translucent Navigation Bar / Toolbar -->
<nav class="nav-bar" style="background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;">
<div class="toolbar-actions"><!-- gearshape (Settings) -->
<button aria-label="Settings" class="plain-button settings">

</svg>
</button>
<!-- plus (Add property) -->
<button aria-label="Add property" class="plain-button plus">
<svg height="22" viewbox="0 0 24 24" width="22">
<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="#FFFFFF"></path>
</svg>
</button></div>
</nav>
<!-- Content -->
<main class="content">
<!-- Large Title -->
<h1 class="large-title">Properties</h1>

<div class="section-header">CONTINUE</div>
<div class="inset-group">

</div>
</div>

</div>

</main>

</body></html>
