    height: 35px;
    background-color: #000000;
    border-radius: 20px;

    align-items: center;

    font-size: 17px;
    font-weight: 400;
    letter-spacing: -0.41px;

    font-weight: 600;
    letter-spacing: -0.41px;

    align-items: center;
    gap: 8px;

    height: 4px;

    border-radius: 9999px;
    overflow: hidden;
  }

    border-radius: 9999px;

    font-size: 13px;
    font-weight: 400;

    letter-spacing: -0.08px;

    align-items: center;
