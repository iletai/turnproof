<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Move-out</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#1F3A64",
          "background-light": "#F2F2F7",
          "background-dark": "#14181e",
        },
        fontFamily: {
          "display": ["-apple-system", "BlinkMacSystemFont", "SF Pro Text", "SF Pro Display", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
      },
    },
  }
</script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #F2F2F7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    color: #000000;
    width: 100%;
    max-width: 390px;
    min-height: 844px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
    padding-bottom: 100px;
  }

  /* Safe Area / Status Bar */
  .status-bar {
    position: sticky;
    top: 0;
    width: 100%;
    height: 47px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    background: transparent;
  }

  .status-time {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #000000;
  }

  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 125px;
    height: 35px;
    background-color: #000000;
    border-radius: 20px;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-icons svg {
    display: block;
    fill: #000000;
  }

  /* Translucent Liquid Glass Navigation Bar */
  .nav-bar {
    position: sticky;
    top: 47px;
    width: 100%;
    height: 44px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
    z-index: 90;
    background: rgba(242, 242, 247, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .nav-back-button {
    background: none;
    border: none;
    height: 44px;
    min-width: 44px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    color: #1F3A64;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: -0.41px;
    cursor: pointer;
  }

  .nav-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.41px;
    color: #000000;
    white-space: nowrap;
    pointer-events: none;
  }

  .nav-action-button {
    background: none;
    border: none;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #000000;
  }

  /* Main Scroll Content */
  .content {
    padding: 16px 16px 32px 16px;
  }

  /* Section Header */
  .section-header {
    font-size: 13px;
    font-weight: 400;
    color: #6C6C70;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-left: 16px;
    margin-bottom: 8px;
  }

  /* Inset Grouped Section */
  .inset-group {
    background: #FFFFFF;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  /* Key-Value Row */
  .kv-row {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 16px;
    position: relative;
  }

  .kv-label {
    font-size: 17px;
    font-weight: 400;
    color: #000000;
    letter-spacing: -0.41px;
  }

  .kv-value {
    font-size: 17px;
    font-weight: 400;
    color: #6C6C70;
    letter-spacing: -0.41px;
    text-align: right;
  }

  /* Row Base */
  .row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    position: relative;
    cursor: pointer;
  }

  /* In Progress Row */
  .inprogress-row {
    min-height: 72px;
  }

  .inprogress-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-right: 12px;
  }

  .title-primary {
    font-size: 17px;
    font-weight: 600;
    line-height: 22px;
    color: #000000;
    letter-spacing: -0.41px;
  }

  .subtitle-secondary {
    font-size: 15px;
    font-weight: 400;
    line-height: 20px;
    color: #6C6C70;
    letter-spacing: -0.24px;
    margin-top: 2px;
  }

  .progress-flex-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .progress-container {
    flex: 1;
    height: 4px;
    background-color: #E5E5EA;
    border-radius: 9999px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 66%;
    background-color: #1F3A64;
    border-radius: 9999px;
  }

  .progress-label {
    font-size: 13px;
    font-weight: 400;
    color: #6C6C70;
    letter-spacing: -0.08px;
    white-space: nowrap;
  }

  /* Reports Row */
  .reports-row {
    min-height: 60px;
    align-items: center;
  }

  .report-leading-icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .report-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-left: 12px;
    padding-right: 12px;
  }

  /* Disclosure Chevron */
  .chevron {
    flex-shrink: 0;
    width: 8px;
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chevron svg {
    fill: #C7C7CC;
  }

  /* Separator starts 16pt from row's leading edge */
  .separator {
    position: absolute;
    bottom: 0;
    left: 16px;
    right: 0;
    height: 0.5px;
    background-color: #C6C6C8;
  }

  /* Bottom Pinned Bar */
  .pinned-bottom-bar {
    position: fixed;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 390px;
    padding: 12px 16px;
    background: rgba(242, 242, 247, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 90;
  }

  .action-capsule-button {
    height: 50px;
    background-color: #1F3A64;
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.41px;
    border-radius: 9999px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
  }

  /* Home Indicator */
  .home-indicator-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 390px;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 8px;
    pointer-events: none;
    z-index: 100;
    background: rgba(242, 242, 247, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .home-indicator {
    width: 139px;
    height: 5px;
    background-color: #000000;
    border-radius: 2.5px;
  }
</style>
</head>
<body style="background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif; color: #FFFFFF; width: 100%; max-width: 390px; height: 844px; margin: 0 auto; position: relative; overflow: hidden;">
<!-- Full-bleed Camera Preview Background -->
<div style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden;">
<img alt="Camera Preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-UDn-4fiQPcPXi5lyzRG5fTgWoHblnACP8wDytXlHGkezR95EU1TtzlhNya6RRY2Y2nCRBCWTQGEPXGobChmarG-7nLzZSCLwXr1covizZpeTOjoObQyMeirgcjko81QDqPCBFQ_DDNg45rfS1_HIaggOXc6GWdEBDCJodyEBPxCVKBEpa_gvEbVmqOFJe-3qUsO3KyqG9vIEFwmAoiupTGwEIyIdpsol762j28rF5pWKZeBNliZPlt-AZvXK2ntaWP0Fg0KkAf6l" style="width: 100%; height: 100%; object-fit: cover; display: block;"/>
</div>
<!-- Safe Area / Status Bar (White Icons & Dynamic Island) -->
<div class="status-bar" style="position: absolute; top: 0; left: 0; width: 100%; height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; z-index: 50; background: transparent;">
<div class="status-time" style="font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: #FFFFFF;">9:41</div>

<svg height="12" viewbox="0 0 25 12" width="25">

<rect fill="#FFFFFF" height="7" rx="1.5" width="13" x="2.5" y="2.5"></rect>

</svg>
</div>
</div>
<!-- Top Header Bar (8pt below status bar = top: 55px) -->
<header style="position: absolute; top: 55px; left: 0; width: 100%; height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 50;">
<!-- Leading: 44pt circular Liquid Glass button (Close) -->
<button aria-label="Close" style="width: 44px; height: 44px; border-radius: 9999px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">

<svg fill="none" height="18" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="18">

<line x1="6" x2="18" y1="6" y2="18"></line>

</button>
<!-- Centered Room & Photo Info -->
<div style="height: 52px; padding: 0 16px; border-radius: 9999px; background: rgba(28, 28, 30, 0.75); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;"><span style="font-size: 17px; font-weight: 600; color: #FFFFFF; letter-spacing: -0.41px; line-height: 20px;">Bathroom</span><span style="font-size: 13px; font-weight: 400; color: rgba(255, 255, 255, 0.8); letter-spacing: -0.08px; line-height: 16px;">Photo 3</span></div>
<!-- Trailing: 44pt circular Liquid Glass button (Import from Photos) -->
<button aria-label="Import from Photos" style="width: 44px; height: 44px; border-radius: 9999px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
<!-- SF Symbol: photo.on.rectangle -->
<svg fill="none" height="20" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20">
<rect height="14" rx="2" width="14" x="3" y="3"></rect>

<polyline points="17 13 13 9 5 17"></polyline>

<!-- Bottom Liquid Glass Panel (sits 8pt above the 34pt home indicator area = bottom: 42px) -->

<!-- Good -->
<div style="flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; color: #FFFFFF; cursor: pointer;">
<!-- SF Symbol checkmark.circle -->

</div>
<!-- Fair -->

<!-- SF Symbol minus.circle -->
<svg fill="none" height="16" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16">
<circle cx="12" cy="12" r="10"></circle>
<line x1="8" x2="16" y1="12" y2="12"></line>
</svg>
<span>Fair</span>
</div>

<!-- SF Symbol xmark.octagon -->
<svg fill="none" height="16" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16">
<polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>

<!-- d. Control row (16pt below) -->

<img alt="Previous Thumbnail" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-UDn-4fiQPcPXi5lyzRG5fTgWoHblnACP8wDytXlHGkezR95EU1TtzlhNya6RRY2Y2nCRBCWTQGEPXGobChmarG-7nLzZSCLwXr1covizZpeTOjoObQyMeirgcjko81QDqPCBFQ_DDNg45rfS1_HIaggOXc6GWdEBDCJodyEBPxCVKBEpa_gvEbVmqOFJe-3qUsO3KyqG9vIEFwmAoiupTGwEIyIdpsol762j28rF5pWKZeBNliZPlt-AZvXK2ntaWP0Fg0KkAf6l" style="width: 100%; height: 100%; object-fit: cover; display: block;"/>

</div>
</div>

<div class="home-indicator-container" style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; pointer-events: none; z-index: 60; display: flex; justify-content: center; align-items: center;"><div class="home-indicator" style="width: 134px; height: 5px; background-color: #FFFFFF; border-radius: 2.5px;"></div></div>
