name: Deploy Staging (TestFlight)

on:
  push:
    branches: ['release/**', 'hotfix/**']
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: iletai/ios-shared/.github/workflows/ios-testflight.yml@main
    with:
      environment: staging
      xcode-version: latest-stable
    secrets: inherit
