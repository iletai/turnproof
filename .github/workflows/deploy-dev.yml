name: Deploy Dev (TestFlight)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: iletai/ios-shared/.github/workflows/ios-testflight.yml@main
    with:
      environment: dev
      xcode-version: latest-stable
    secrets: inherit
