name: Screenshots

# Raw store captures from SnapshotUITests; composing and uploading to ASC stay separate, reviewed steps.
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Generate project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Capture
        run: bundle exec fastlane screenshots --env prod upload:false
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/screenshots
          if-no-files-found: error
          retention-days: 14
