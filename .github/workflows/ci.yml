name: CI

# Feature work: every PR (into develop, release/*, main) and every push to feature/*.
on:
  pull_request:
  push:
    branches: ['feature/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: iletai/ios-shared/.github/workflows/ios-ci.yml@main
    with:
      xcode-version: latest-stable
    secrets: inherit
